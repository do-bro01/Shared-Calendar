[project]
name = "sc-scripts"
version = "0.1.0"
description = "SC 합성 데이터 + RAGAS 평가 스크립트 (TS 본체와 분리된 1회용 도구)"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.9.0",
    "openai>=1.55.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[dependency-groups]
ragas = [
    "ragas>=0.2.0",
    "datasets>=3.0.0",
    "pandas>=2.2.0",
]

[tool.uv]
package = false
