<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a82d1"/>
      <stop offset="100%" stop-color="#395fa5"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <rect x="200" y="272" width="624" height="584" rx="72" ry="72"/>
    </clipPath>
  </defs>

  <!-- 둥근 사각형 배경 (iOS squircle) -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>

  <!-- 달력 상단 바인딩 링 (두 개) -->
  <rect x="372" y="204" width="42" height="140" rx="21" fill="#ffffff"/>
  <rect x="610" y="204" width="42" height="140" rx="21" fill="#ffffff"/>

  <!-- 달력 본체 (흰색 둥근 사각형) -->
  <rect x="200" y="272" width="624" height="584" rx="72" ry="72" fill="#ffffff"/>

  <!-- 상단 헤더 띠 + 요일 점 7개 (본체 라운드에 맞게 클립) -->
  <g clip-path="url(#bodyClip)">
    <rect x="200" y="272" width="624" height="76" fill="#395fa5"/>
    <g fill="#ffffff">
      <circle cx="302" cy="310" r="12"/>
      <circle cx="442" cy="310" r="12"/>
      <circle cx="582" cy="310" r="12"/>
      <circle cx="722" cy="310" r="12"/>
    </g>
  </g>

  <!-- SC 로고 (본체 중앙) -->
  <g transform="translate(512 620) scale(0.5) translate(-517.5 -495)"
     fill="none"
     stroke="#395fa5"
     stroke-width="105"
     stroke-linecap="round"
     stroke-linejoin="round">
    <!-- S -->
    <path d="M 440 345
             C 440 280, 320 270, 245 295
             C 165 325, 165 410, 240 445
             C 310 475, 380 485, 440 525
             C 510 570, 510 660, 415 685
             C 315 715, 200 695, 175 650"/>
    <!-- C -->
    <path d="M 845 385
             C 795 320, 685 305, 600 350
             C 510 400, 490 515, 540 600
             C 590 685, 700 705, 790 675
             C 820 665, 845 645, 860 620"/>
  </g>
</svg>
